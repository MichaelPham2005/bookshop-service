spring:
  profiles:
    default: local
    group:
      init: local

management:
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    defaults:
      enabled: false
    ping:
      enabled: true
    db:
      enabled: true
